name: Validate rPPG
on:
  pull_request:
  push:
    branches: [main, "codex/pos-valid-face-segments"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: node --test tests/rppg.test.mjs
      - run: npm run build
